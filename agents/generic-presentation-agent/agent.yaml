name: "Generic Presentation Agent"
description: "Generates branded Volt Technologies HTML slideshows from any content"
version: "1.1.0"
model: "claude-opus-4-5-20251101"

# Agent capabilities
capabilities:
  - content_analysis
  - html_generation
  - pptx_generation
  - presentation_design
  - brand_compliance

# Input types this agent can process
inputs:
  - type: "text"
    description: "Raw text content to convert into slides"
  - type: "markdown"
    description: "Markdown formatted content"
  - type: "outline"
    description: "Bullet-point outline of presentation topics"
  - type: "url"
    description: "URL to fetch and convert content from"

# Output configuration
output:
  formats:
    - format: "html"
      location: "output/"
      description: "Self-contained branded HTML slideshow file"
    - format: "pptx"
      location: "output/"
      description: "PowerPoint presentation for offline viewing and editing"
  primary: "pptx"
  conversion:
    enabled: true
    tool: "tools/convert-html-to-pptx.js"

# Assets used by this agent
assets:
  brand:
    - "assets/prompts/brand-guidelines.md"
  logos:
    - "assets/logos/black-VOLT-TECHNOLOGIES2 (L).png"
    - "assets/logos/white-VOLT-TECHNOLOGIES3(S).png"
  templates:
    - "assets/templates/slideshow-base.html"
  styles:
    - "assets/templates/slideshow-styles.css"

# MCP server connections
mcp_servers:
  - servers/notion

# Default settings
settings:
  theme:
    primary: "#000000"      # Black
    secondary: "#FFFFFF"    # White
    accent: "#D4AF37"       # Gold
    logo_yellow: "#FFD93D"
    logo_orange: "#F4A020"
  typography:
    heading: "Montserrat"
    body: "Fira Sans"
    code: "Fira Code"
  slide_defaults:
    transition: "fade"
    duration: "0.5s"
  features:
    - keyboard_navigation
    - touch_swipe_navigation
    - progress_indicator
    - slide_counter
    - volt_branding
    - pptx_export

# Skills used by this agent
skills:
  - core/html-to-pptx
