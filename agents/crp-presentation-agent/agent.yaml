name: "CRP Presentation Agent"
description: "Generates Conference Room Pilot (CRP) testing session presentations for Dynamics 365 Business Central implementations by pulling scenarios from Notion"
version: "1.0.0"
model: "claude-opus-4-5-20251101"

# Agent capabilities
capabilities:
  - notion_integration
  - crp_scenario_extraction
  - html_generation
  - pptx_generation
  - presentation_design
  - brand_compliance
  - d365_business_central_expertise
  - testing_facilitation

# Input types this agent can process
inputs:
  - type: "notion_crp_scenarios"
    description: "CRP scenario data from Notion database assigned to a project"
  - type: "project_name"
    description: "Project name to filter CRP scenarios (e.g., 'White Warren')"
  - type: "testing_session_type"
    description: "Type of testing session (e.g., 'Manufacturing', 'Warehousing', 'Sales', 'Finance')"
  - type: "process_flow_grouping"
    description: "Category of process flows (e.g., 'Order to Cash', 'Procure to Pay', 'Inventory Management')"
  - type: "sprint_context"
    description: "Sprint number or CRP phase context"

# Output configuration
output:
  formats:
    - format: "html"
      location: "output/"
      description: "Interactive CRP presentation HTML slideshow for testing sessions"
    - format: "pptx"
      location: "output/"
      description: "PowerPoint presentation for customer sign-off during CRP sessions"
  primary: "pptx"
  conversion:
    enabled: true
    tool: "tools/convert-html-to-pptx.js"

# Sub-agents used by this agent
sub_agents:
  - name: "CRP Scenario Fetcher"
    path: "sub-agents/crp-scenario-fetcher"
    description: "Queries Notion for CRP scenarios by project and process flow, organizes by testing category"
  - name: "Presentation Creator"
    path: "sub-agents/presentation-creator"
    description: "Creates the final HTML presentation with CRP scenarios for customer sign-off"

# Assets used by this agent
assets:
  brand:
    - "assets/prompts/brand-guidelines.md"
  logos:
    - "assets/logos/black-VOLT-TECHNOLOGIES2 (L).png"
    - "assets/logos/white-VOLT-TECHNOLOGIES3(S).png"
  templates:
    - "assets/templates/Show and tell powerpoint presentation example.pdf"
    - "assets/templates/slideshow-base.html"
    - "assets/templates/slideshow-styles.css"

# MCP server connections
mcp_servers:
  - servers/notion

# Default settings
settings:
  theme:
    primary: "#000000"      # Black
    secondary: "#FFFFFF"    # White
    accent: "#D4AF37"       # Gold
    logo_yellow: "#FFD93D"
    logo_orange: "#F4A020"
  typography:
    heading: "Montserrat"
    body: "Fira Sans"
    code: "Fira Code"
  slide_defaults:
    transition: "fade"
    duration: "0.5s"
  scenario_settings:
    include_sign_off_checkbox: true
    include_scenario_id: true
    group_by_process_flow: true
  features:
    - keyboard_navigation
    - touch_swipe_navigation
    - progress_indicator
    - slide_counter
    - thumbnail_grid
    - print_support
    - pptx_export
    - sign_off_tracking

# Skills used by this agent
skills:
  - core/html-to-pptx
