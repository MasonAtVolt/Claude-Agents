name: "Sprint Goals Agent"
description: "Retrieves sprint goals from Notion that are assigned to specific process flows"
version: "1.0.0"
model: "claude-opus-4-5-20251101"

capabilities:
  - notion_query
  - goal_extraction
  - sprint_planning_analysis
  - process_flow_mapping

inputs:
  - type: "sprint_identifier"
    description: "Sprint number or name"
  - type: "process_flows"
    description: "List of process flows being covered"
  - type: "notion_database_id"
    description: "Notion database containing sprint goals"

output:
  format: "json"
  schema:
    sprint_goals:
      - id: "string"
        title: "string"
        description: "string"
        process_flows: "array"
        status: "string"
        acceptance_criteria: "array"

mcp_servers:
  - name: "notion"
    path: "mcp/servers/notion.json"
    env:
      NOTION_API_TOKEN: "${NOTION_API_TOKEN}"  # From .env file

# Notion integration settings
notion:
  api_token_env: "NOTION_API_TOKEN"
  workspace: "Volt Technologies' Space"
  database: "Sprint Goals"

# File paths
paths:
  input: "input/"
  output: "output/"

settings:
  goal_statuses:
    - "Not Started"
    - "In Progress"
    - "Complete"
    - "Blocked"
    - "Deferred"
