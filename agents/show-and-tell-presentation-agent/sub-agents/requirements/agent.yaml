name: "Requirements Agent"
description: "Extracts D365 Business Central requirements from process flows and shadowing meeting transcripts"
version: "1.0.0"
model: "claude-opus-4-5-20251101"

capabilities:
  - transcript_analysis
  - requirements_extraction
  - d365_business_central_expertise
  - notion_integration
  - process_flow_mapping

inputs:
  - type: "process_flows"
    description: "List of process flows being covered in the meeting"
  - type: "transcript"
    description: "Shadowing meeting transcript from Notion"
  - type: "notion_database_id"
    description: "Notion database containing transcripts"

output:
  format: "json"
  schema:
    requirements:
      - id: "string"
        title: "string"
        description: "string"
        process_flow: "string"
        category: "string"
        priority: "string"
        d365_module: "string"

mcp_servers:
  - name: "notion"
    path: "mcp/servers/notion.json"
    env:
      NOTION_API_TOKEN: "${NOTION_API_TOKEN}"  # From .env file

# Notion integration settings
notion:
  api_token_env: "NOTION_API_TOKEN"
  workspace: "Volt Technologies' Space"
  database: "Transcripts"

# File paths
paths:
  input: "input/"       # Transcript files location
  output: "output/"

settings:
  d365_modules:
    - "Financial Management"
    - "Sales & Receivables"
    - "Purchases & Payables"
    - "Inventory Management"
    - "Warehouse Management"
    - "Manufacturing"
  requirement_categories:
    - "Functional"
    - "Technical"
    - "Integration"
    - "Reporting"
    - "Security"
