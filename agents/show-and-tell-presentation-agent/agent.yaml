name: "Show and Tell Presentation Agent"
description: "Generates D365 Business Central Show and Tell presentations from Notion data and transcripts"
version: "1.1.0"
model: "claude-opus-4-5-20251101"

# Agent capabilities
capabilities:
  - transcript_parsing
  - html_generation
  - pptx_generation
  - presentation_design
  - notion_integration
  - brand_compliance
  - d365_business_central_expertise

# Input types this agent can process
inputs:
  - type: "notion_page"
    description: "Notion page URL or title containing meeting transcript"
  - type: "transcript"
    description: "Raw meeting transcript text"
  - type: "markdown"
    description: "Markdown formatted transcript"
  - type: "aggregated_data"
    description: "Combined output from sub-agents"
  - type: "sprint_context"
    description: "Sprint number and process flow grouping"

# Output configuration
output:
  formats:
    - format: "html"
      location: "output/"
      description: "Interactive Show and Tell HTML slideshow presentation"
    - format: "pptx"
      location: "output/"
      description: "PowerPoint presentation for client delivery"
  primary: "pptx"
  conversion:
    enabled: true
    tool: "tools/convert-html-to-pptx.js"

# Sub-agents used by this agent
sub_agents:
  - name: "Process Flow Percentage"
    path: "sub-agents/process-flow-percentage"
    description: "Queries Notion for design completion percentages"
  - name: "Requirements"
    path: "sub-agents/requirements"
    description: "Extracts requirements from process flows and transcripts"
  - name: "Sprint Goals"
    path: "sub-agents/sprint-goals"
    description: "Pulls sprint goals assigned to process flows"
  - name: "Demonstration"
    path: "sub-agents/demonstration"
    description: "Creates D365 BC demo steps for the presentation"

# Assets used by this agent
assets:
  brand:
    - "assets/prompts/brand-guidelines.md"
  logos:
    - "assets/logos/black-VOLT-TECHNOLOGIES2 (L).png"
    - "assets/logos/white-VOLT-TECHNOLOGIES3(S).png"
  templates:
    - "assets/templates/Show and tell powerpoint presentation example.pdf"

# MCP server connections
mcp_servers:
  - name: "notion"
    path: "mcp/servers/notion.json"
    env:
      NOTION_API_TOKEN: "${NOTION_API_TOKEN}"  # From .env file

# Notion integration settings
notion:
  api_token_env: "NOTION_API_TOKEN"
  workspace: "Volt Technologies' Space"
  databases:
    transcripts: "Transcripts"
    process_flows: "Process Flows"
    sprint_goals: "Sprint Goals"

# File paths
paths:
  input: "input/"       # Transcript files location
  output: "output/"     # Generated presentations location

# Default settings
settings:
  theme:
    primary: "#000000"      # Black
    secondary: "#FFFFFF"    # White
    accent: "#D4AF37"       # Gold
    logo_yellow: "#FFD93D"
    logo_orange: "#F4A020"
  typography:
    heading: "Montserrat"
    body: "Fira Sans"
    code: "Fira Code"
  slide_defaults:
    transition: "fade"
    duration: "0.5s"
  features:
    - keyboard_navigation
    - touch_swipe_navigation
    - progress_indicator
    - slide_counter
    - thumbnail_grid
    - print_support
    - pptx_export

# Skills used by this agent
skills:
  - core/html-to-pptx
