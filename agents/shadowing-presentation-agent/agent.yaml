name: "Shadowing Presentation Agent"
description: "Generates Dynamics 365 Business Central shadowing meeting presentations with questions derived from Notion process flows"
version: "1.0.0"
model: "claude-opus-4-5-20251101"

# Agent capabilities
capabilities:
  - notion_integration
  - question_generation
  - html_generation
  - pptx_generation
  - presentation_design
  - brand_compliance
  - d365_business_central_expertise
  - shadowing_facilitation

# Input types this agent can process
inputs:
  - type: "notion_process_flows"
    description: "Process flow data from Notion database"
  - type: "process_flow_grouping"
    description: "Category of process flows (e.g., 'Inventory Management', 'Order to Cash')"
  - type: "client_name"
    description: "Client/project name for the presentation"
  - type: "sprint_context"
    description: "Sprint number and shadowing session context"

# Output configuration
output:
  formats:
    - format: "html"
      location: "output/"
      description: "Interactive Shadowing presentation HTML slideshow with questions for customer meetings"
    - format: "pptx"
      location: "output/"
      description: "PowerPoint presentation for client shadowing sessions"
  primary: "pptx"
  conversion:
    enabled: true
    tool: "tools/convert-html-to-pptx.js"

# Sub-agents used by this agent
sub_agents:
  - name: "Shadowing Question Generator"
    path: "sub-agents/shadowing-question-generator"
    description: "Generates 4-10 shadowing questions per process flow from Notion data"
  - name: "Presentation Creator"
    path: "sub-agents/presentation-creator"
    description: "Creates the final HTML presentation with branded styling"

# Assets used by this agent
assets:
  brand:
    - "assets/prompts/brand-guidelines.md"
  logos:
    - "assets/logos/black-VOLT-TECHNOLOGIES2 (L).png"
    - "assets/logos/white-VOLT-TECHNOLOGIES3(S).png"
  templates:
    - "assets/templates/Show and tell powerpoint presentation example.pdf"
    - "assets/templates/slideshow-base.html"
    - "assets/templates/slideshow-styles.css"

# MCP server connections
mcp_servers:
  - name: "notion"
    path: "mcp/servers/notion.json"
    env:
      NOTION_API_TOKEN: "${NOTION_API_TOKEN}"  # From .env file

# Notion integration settings
notion:
  api_token_env: "NOTION_API_TOKEN"
  workspace: "Volt Technologies' Space"
  databases:
    process_flows: "Process Flows"
    transcripts: "Transcripts"

# File paths
paths:
  input: "input/"       # Transcript files location
  output: "output/"     # Generated presentations location

# Default settings
settings:
  theme:
    primary: "#000000"      # Black
    secondary: "#FFFFFF"    # White
    accent: "#D4AF37"       # Gold
    logo_yellow: "#FFD93D"
    logo_orange: "#F4A020"
  typography:
    heading: "Montserrat"
    body: "Fira Sans"
    code: "Fira Code"
  slide_defaults:
    transition: "fade"
    duration: "0.5s"
  question_settings:
    min_questions_per_flow: 4
    max_questions_per_flow: 10
  features:
    - keyboard_navigation
    - touch_swipe_navigation
    - progress_indicator
    - slide_counter
    - thumbnail_grid
    - print_support
    - pptx_export

# Skills used by this agent
skills:
  - core/html-to-pptx
