<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PRESENTATION_TITLE}}</title>
    <link rel="stylesheet" href="slideshow-styles.css">
    <style>
        /* Inline styles can be added here for self-contained files */
    </style>
</head>
<body>
    <div class="slideshow-container">
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <!-- Slides Container -->
        <div class="slides" id="slides">

            <!-- Title Slide Template -->
            <div class="slide slide-title active">
                <div class="slide-content">
                    <h1 class="title">{{PRESENTATION_TITLE}}</h1>
                    <p class="subtitle">{{PRESENTATION_SUBTITLE}}</p>
                    <div class="meta">
                        <span class="author">{{AUTHOR}}</span>
                        <span class="date">{{DATE}}</span>
                    </div>
                </div>
            </div>

            <!-- Content Slide Template -->
            <div class="slide slide-content-type">
                <div class="slide-content">
                    <h2 class="slide-heading">{{SLIDE_TITLE}}</h2>
                    <ul class="content-list">
                        <li>{{BULLET_POINT}}</li>
                    </ul>
                </div>
            </div>

            <!-- Section Divider Template -->
            <div class="slide slide-section">
                <div class="slide-content">
                    <div class="section-divider"></div>
                    <h2 class="section-title">{{SECTION_TITLE}}</h2>
                </div>
            </div>

            <!-- Image Slide Template -->
            <div class="slide slide-image">
                <div class="slide-content">
                    <h2 class="slide-heading">{{SLIDE_TITLE}}</h2>
                    <div class="image-container">
                        <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
                    </div>
                    <p class="image-caption">{{IMAGE_CAPTION}}</p>
                </div>
            </div>

            <!-- Code Slide Template -->
            <div class="slide slide-code">
                <div class="slide-content">
                    <h2 class="slide-heading">{{SLIDE_TITLE}}</h2>
                    <pre class="code-block"><code>{{CODE_CONTENT}}</code></pre>
                </div>
            </div>

            <!-- Closing Slide Template -->
            <div class="slide slide-closing">
                <div class="slide-content">
                    <h2 class="closing-title">{{CLOSING_TITLE}}</h2>
                    <p class="closing-message">{{CLOSING_MESSAGE}}</p>
                    <div class="contact-info">
                        {{CONTACT_INFO}}
                    </div>
                </div>
            </div>

        </div>

        <!-- Navigation Controls -->
        <div class="nav-controls">
            <button class="nav-btn nav-prev" id="prevBtn" aria-label="Previous slide">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
            </button>
            <button class="nav-btn nav-next" id="nextBtn" aria-label="Next slide">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
            </button>
        </div>

        <!-- Slide Counter -->
        <div class="slide-counter" id="slideCounter">
            <span id="currentSlide">1</span> / <span id="totalSlides">1</span>
        </div>

        <!-- Fullscreen Button -->
        <button class="fullscreen-btn" id="fullscreenBtn" aria-label="Toggle fullscreen">
            <svg viewBox="0 0 24 24" fill="currentColor" class="expand-icon">
                <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="currentColor" class="compress-icon" style="display:none">
                <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
            </svg>
        </button>

        <!-- Click Areas for Navigation -->
        <div class="click-area click-left" id="clickLeft"></div>
        <div class="click-area click-right" id="clickRight"></div>
    </div>

    <script>
        // Slideshow Navigation Logic
        (function() {
            const slides = document.querySelectorAll('.slide');
            const progress = document.getElementById('progress');
            const currentSlideEl = document.getElementById('currentSlide');
            const totalSlidesEl = document.getElementById('totalSlides');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const clickLeft = document.getElementById('clickLeft');
            const clickRight = document.getElementById('clickRight');

            let currentIndex = 0;
            const totalSlides = slides.length;

            // Initialize
            totalSlidesEl.textContent = totalSlides;
            updateSlide();

            function updateSlide() {
                slides.forEach((slide, index) => {
                    slide.classList.remove('active', 'prev', 'next');
                    if (index === currentIndex) {
                        slide.classList.add('active');
                    } else if (index < currentIndex) {
                        slide.classList.add('prev');
                    } else {
                        slide.classList.add('next');
                    }
                });

                currentSlideEl.textContent = currentIndex + 1;
                progress.style.width = ((currentIndex + 1) / totalSlides * 100) + '%';

                // Update button states
                prevBtn.disabled = currentIndex === 0;
                nextBtn.disabled = currentIndex === totalSlides - 1;
            }

            function nextSlide() {
                if (currentIndex < totalSlides - 1) {
                    currentIndex++;
                    updateSlide();
                }
            }

            function prevSlide() {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateSlide();
                }
            }

            function goToSlide(index) {
                if (index >= 0 && index < totalSlides) {
                    currentIndex = index;
                    updateSlide();
                }
            }

            function toggleFullscreen() {
                const container = document.querySelector('.slideshow-container');
                const expandIcon = fullscreenBtn.querySelector('.expand-icon');
                const compressIcon = fullscreenBtn.querySelector('.compress-icon');

                if (!document.fullscreenElement) {
                    container.requestFullscreen().then(() => {
                        expandIcon.style.display = 'none';
                        compressIcon.style.display = 'block';
                    });
                } else {
                    document.exitFullscreen().then(() => {
                        expandIcon.style.display = 'block';
                        compressIcon.style.display = 'none';
                    });
                }
            }

            // Event Listeners
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            clickLeft.addEventListener('click', prevSlide);
            clickRight.addEventListener('click', nextSlide);

            // Keyboard Navigation
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowRight':
                    case ' ':
                    case 'Enter':
                        e.preventDefault();
                        nextSlide();
                        break;
                    case 'ArrowLeft':
                    case 'Backspace':
                        e.preventDefault();
                        prevSlide();
                        break;
                    case 'Home':
                        e.preventDefault();
                        goToSlide(0);
                        break;
                    case 'End':
                        e.preventDefault();
                        goToSlide(totalSlides - 1);
                        break;
                    case 'f':
                    case 'F':
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                }
            });

            // Touch/Swipe Support
            let touchStartX = 0;
            let touchEndX = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });

            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;

                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
            }

            // Handle fullscreen change
            document.addEventListener('fullscreenchange', () => {
                const expandIcon = fullscreenBtn.querySelector('.expand-icon');
                const compressIcon = fullscreenBtn.querySelector('.compress-icon');

                if (document.fullscreenElement) {
                    expandIcon.style.display = 'none';
                    compressIcon.style.display = 'block';
                } else {
                    expandIcon.style.display = 'block';
                    compressIcon.style.display = 'none';
                }
            });
        })();
    </script>
</body>
</html>
