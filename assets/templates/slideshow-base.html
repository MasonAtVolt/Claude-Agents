<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PRESENTATION_TITLE}}</title>
    <link rel="stylesheet" href="slideshow-styles.css">
    <style>
        /* Inline styles can be added here for self-contained files */
    </style>
</head>
<body>
    <div class="slideshow-container">
        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>

        <!-- Slides Container -->
        <div class="slides" id="slides">

            <!-- Title Slide Template -->
            <div class="slide slide-title active">
                <div class="slide-content">
                    <h1 class="title">{{PRESENTATION_TITLE}}</h1>
                    <p class="subtitle">{{PRESENTATION_SUBTITLE}}</p>
                    <div class="meta">
                        <span class="author">{{AUTHOR}}</span>
                        <span class="date">{{DATE}}</span>
                    </div>
                </div>
            </div>

            <!-- Content Slide Template -->
            <div class="slide slide-content-type">
                <div class="slide-content">
                    <h2 class="slide-heading">{{SLIDE_TITLE}}</h2>
                    <ul class="content-list">
                        <li>{{BULLET_POINT}}</li>
                    </ul>
                </div>
            </div>

            <!-- Section Divider Template -->
            <div class="slide slide-section">
                <div class="slide-content">
                    <div class="section-divider"></div>
                    <h2 class="section-title">{{SECTION_TITLE}}</h2>
                </div>
            </div>

            <!-- Image Slide Template -->
            <div class="slide slide-image">
                <div class="slide-content">
                    <h2 class="slide-heading">{{SLIDE_TITLE}}</h2>
                    <div class="image-container">
                        <img src="{{IMAGE_URL}}" alt="{{IMAGE_ALT}}">
                    </div>
                    <p class="image-caption">{{IMAGE_CAPTION}}</p>
                </div>
            </div>

            <!-- Code Slide Template -->
            <div class="slide slide-code">
                <div class="slide-content">
                    <h2 class="slide-heading">{{SLIDE_TITLE}}</h2>
                    <pre class="code-block"><code>{{CODE_CONTENT}}</code></pre>
                </div>
            </div>

            <!-- Closing Slide Template -->
            <div class="slide slide-closing">
                <div class="slide-content">
                    <h2 class="closing-title">{{CLOSING_TITLE}}</h2>
                    <p class="closing-message">{{CLOSING_MESSAGE}}</p>
                    <div class="contact-info">
                        {{CONTACT_INFO}}
                    </div>
                </div>
            </div>

        </div>

        <!-- Slide Counter (subtle, bottom-right) -->
        <div class="slide-counter" id="slideCounter">
            <span id="currentSlide">1</span> / <span id="totalSlides">1</span>
        </div>
    </div>

    <script>
        // Slideshow Navigation Logic
        (function() {
            const slides = document.querySelectorAll('.slide');
            const progress = document.getElementById('progress');
            const currentSlideEl = document.getElementById('currentSlide');
            const totalSlidesEl = document.getElementById('totalSlides');

            let currentIndex = 0;
            const totalSlides = slides.length;

            // Initialize
            totalSlidesEl.textContent = totalSlides;
            updateSlide();

            function updateSlide() {
                slides.forEach((slide, index) => {
                    slide.classList.remove('active', 'prev', 'next');
                    if (index === currentIndex) {
                        slide.classList.add('active');
                    } else if (index < currentIndex) {
                        slide.classList.add('prev');
                    } else {
                        slide.classList.add('next');
                    }
                });

                currentSlideEl.textContent = currentIndex + 1;
                progress.style.width = ((currentIndex + 1) / totalSlides * 100) + '%';
            }

            function nextSlide() {
                if (currentIndex < totalSlides - 1) {
                    currentIndex++;
                    updateSlide();
                }
            }

            function prevSlide() {
                if (currentIndex > 0) {
                    currentIndex--;
                    updateSlide();
                }
            }

            function goToSlide(index) {
                if (index >= 0 && index < totalSlides) {
                    currentIndex = index;
                    updateSlide();
                }
            }

            // Keyboard Navigation
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowRight':
                    case ' ':
                    case 'Enter':
                        e.preventDefault();
                        nextSlide();
                        break;
                    case 'ArrowLeft':
                    case 'Backspace':
                        e.preventDefault();
                        prevSlide();
                        break;
                    case 'Home':
                        e.preventDefault();
                        goToSlide(0);
                        break;
                    case 'End':
                        e.preventDefault();
                        goToSlide(totalSlides - 1);
                        break;
                }
            });

            // Touch/Swipe Support
            let touchStartX = 0;
            let touchEndX = 0;

            document.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });

            document.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            });

            function handleSwipe() {
                const swipeThreshold = 50;
                const diff = touchStartX - touchEndX;

                if (Math.abs(diff) > swipeThreshold) {
                    if (diff > 0) {
                        nextSlide();
                    } else {
                        prevSlide();
                    }
                }
            }
        })();
    </script>
</body>
</html>
